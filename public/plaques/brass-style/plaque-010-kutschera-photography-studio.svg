<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <style>
      .title { font-family: Georgia, 'Times New Roman', serif; }
      .text { font-family: Georgia, 'Times New Roman', serif; }
      .url { font-family: 'Helvetica Neue', Arial, sans-serif; }
    </style>
    <!-- Brass gradient for realistic look -->
    <linearGradient id="brassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37"/>
      <stop offset="25%" style="stop-color:#c9a227"/>
      <stop offset="50%" style="stop-color:#d4af37"/>
      <stop offset="75%" style="stop-color:#b8960f"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Main brass background -->
  <rect width="800" height="450" fill="url(#brassGradient)"/>

  <!-- Corner screws -->
  <circle cx="25" cy="25" r="8" fill="#8b7355" stroke="#6b5a45" stroke-width="1"/>
  <circle cx="25" cy="25" r="3" fill="#5a4a35"/>
  <circle cx="775" cy="25" r="8" fill="#8b7355" stroke="#6b5a45" stroke-width="1"/>
  <circle cx="775" cy="25" r="3" fill="#5a4a35"/>
  <circle cx="25" cy="425" r="8" fill="#8b7355" stroke="#6b5a45" stroke-width="1"/>
  <circle cx="25" cy="425" r="3" fill="#5a4a35"/>
  <circle cx="775" cy="425" r="8" fill="#8b7355" stroke="#6b5a45" stroke-width="1"/>
  <circle cx="775" cy="425" r="3" fill="#5a4a35"/>

  <!-- Business Type (top, smaller) -->
  <text x="335" y="70" text-anchor="middle" class="text"
        font-size="16" fill="#4a4639" font-style="italic">
    Photography
  </text>

  <!-- Business Name (large, centered) -->
  <text x="335" y="125" text-anchor="middle" class="title"
        font-size="32" fill="#2d2a24" font-weight="600">
    Kutschera Photography Studio
  </text>

  <!-- Dates -->
  <text x="335" y="175" text-anchor="middle" class="text"
        font-size="24" fill="#2d2a24">
    1930 – 1938
  </text>

  <!-- Address -->
  <text x="335" y="225" text-anchor="middle" class="text"
        font-size="18" fill="#4a4639">
    Potsdamer Straße 125, Berlin
  </text>

  <!-- URL at bottom -->
  <text x="335" y="405" text-anchor="middle" class="url"
        font-size="13" fill="#4a4639" letter-spacing="1">
    storytimemaps.com
  </text>

