<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .title { font-family: Georgia, 'Times New Roman', serif; }
      .text { font-family: Georgia, 'Times New Roman', serif; }
      .url { font-family: 'Helvetica Neue', Arial, sans-serif; }
    </style>
    <!-- Brass gradient for realistic look -->
    <linearGradient id="brassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37"/>
      <stop offset="25%" style="stop-color:#c9a227"/>
      <stop offset="50%" style="stop-color:#d4af37"/>
      <stop offset="75%" style="stop-color:#b8960f"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
    <!-- Subtle texture overlay -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
  </defs>

  <!-- Main brass background -->
  <rect width="800" height="500" fill="url(#brassGradient)"/>

  <!-- Subtle worn texture overlay -->
  <rect width="800" height="500" fill="url(#brassGradient)" opacity="0.95"/>

  <!-- Corner screws -->
  <circle cx="25" cy="25" r="8" fill="#8b7355" stroke="#6b5a45" stroke-width="1"/>
  <circle cx="25" cy="25" r="3" fill="#5a4a35"/>
  <circle cx="775" cy="25" r="8" fill="#8b7355" stroke="#6b5a45" stroke-width="1"/>
  <circle cx="775" cy="25" r="3" fill="#5a4a35"/>
  <circle cx="25" cy="475" r="8" fill="#8b7355" stroke="#6b5a45" stroke-width="1"/>
  <circle cx="25" cy="475" r="3" fill="#5a4a35"/>
  <circle cx="775" cy="475" r="8" fill="#8b7355" stroke="#6b5a45" stroke-width="1"/>
  <circle cx="775" cy="475" r="3" fill="#5a4a35"/>

  <!-- Business Type (top, smaller) -->
  <text x="340" y="80" class="text"
        font-size="16" fill="#4a4639" font-style="italic">
    Furrier
  </text>

  <!-- Business Name (large, centered) -->
  <text x="340" y="150" class="title"
        font-size="38" fill="#2d2a24" font-weight="600">
    Pelz Furrier
  </text>

  <!-- Dates -->
  <text x="340" y="205" class="text"
        font-size="24" fill="#2d2a24">
    1918 – 1937
  </text>

  <!-- Address -->
  <text x="340" y="270" class="text"
        font-size="18" fill="#4a4639">
    Friedrichstraße 180, Berlin
  </text>

  <!-- URL at bottom -->
  <text x="340" y="450" class="url"
        font-size="14" fill="#4a4639" letter-spacing="1">
    storytimemaps.com
  </text>

  <!-- QR Code Section (right side) -->
  <g transform="translate(650, 190)">
    <rect x="-10" y="-10" width="120" height="120" fill="#ffffff" stroke="#2d2a24" stroke-width="1"/>
    <g transform="translate(0, 0)">
      <path fill="#ffffff" d="M0 0h31v31H0z"/><path stroke="#000000" d="M1 1.5h7m2 0h2m1 0h3m2 0h1m1 0h2m1 0h7M1 2.5h1m5 0h1m2 0h8m1 0h1m3 0h1m5 0h1M1 3.5h1m1 0h3m1 0h1m1 0h5m1 0h1m1 0h1m2 0h1m2 0h1m1 0h3m1 0h1M1 4.5h1m1 0h3m1 0h1m1 0h3m2 0h2m2 0h1m2 0h1m1 0h1m1 0h3m1 0h1M1 5.5h1m1 0h3m1 0h1m1 0h2m1 0h3m5 0h2m1 0h1m1 0h3m1 0h1M1 6.5h1m5 0h1m1 0h2m1 0h1m3 0h2m3 0h1m1 0h1m5 0h1M1 7.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M9 8.5h1m5 0h3m1 0h3M1 9.5h1m1 0h5m2 0h2m1 0h3m2 0h1m1 0h1m2 0h5M4 10.5h1m6 0h1m1 0h1m3 0h5m1 0h3m3 0h1M1 11.5h1m2 0h5m1 0h1m1 0h1m2 0h3m1 0h1m2 0h2M2 12.5h1m2 0h2m2 0h2m1 0h2m3 0h1m3 0h1m3 0h2m1 0h1M3 13.5h1m1 0h6m3 0h1m3 0h1m2 0h1m2 0h1m1 0h2M2 14.5h3m4 0h2m1 0h4m1 0h9m3 0h1M1 15.5h1m1 0h1m1 0h1m1 0h1m2 0h2m1 0h1m1 0h3m3 0h1m1 0h2m1 0h2M3 16.5h1m2 0h1m3 0h1m4 0h1m4 0h1m3 0h1m3 0h1M2 17.5h2m1 0h1m1 0h3m1 0h4m1 0h1m1 0h1m2 0h1m4 0h2M1 18.5h1m2 0h1m1 0h1m2 0h1m5 0h1m1 0h1m1 0h7m1 0h1m1 0h1M1 19.5h1m1 0h3m1 0h1m1 0h2m1 0h5m5 0h1m2 0h1m1 0h1M1 20.5h1m1 0h1m1 0h2m2 0h2m1 0h1m4 0h1m2 0h2m2 0h2m2 0h1M1 21.5h1m1 0h2m1 0h2m2 0h1m1 0h1m5 0h1m1 0h6m1 0h3M9 22.5h3m2 0h1m3 0h2m1 0h1m3 0h5M1 23.5h7m2 0h1m2 0h5m2 0h2m1 0h1m1 0h3M1 24.5h1m5 0h1m1 0h2m3 0h1m6 0h1m3 0h1M1 25.5h1m1 0h3m1 0h1m1 0h1m1 0h2m2 0h4m2 0h5m1 0h3M1 26.5h1m1 0h3m1 0h1m1 0h2m1 0h1m1 0h1m2 0h1m1 0h3m2 0h1m1 0h4M1 27.5h1m1 0h3m1 0h1m1 0h1m2 0h3m1 0h1m2 0h1m3 0h6M1 28.5h1m5 0h1m5 0h4m3 0h3m1 0h1m1 0h1m1 0h1M1 29.5h7m1 0h1m2 0h7m1 0h1m1 0h1m2 0h3"/>
    </g>
  </g>

</svg>