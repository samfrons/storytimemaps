<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;family=Playfair+Display:wght@400;600&amp;display=swap');
      .title { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; }
      .mono { font-family: 'Space Mono', 'Courier New', monospace; }
      .serif { font-family: 'Playfair Display', Georgia, serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="#f5f5dc"/>

  <!-- Border -->
  <rect x="15" y="15" width="570" height="770"
        fill="none" stroke="#2c2c2c" stroke-width="3"/>
  <rect x="25" y="25" width="550" height="750"
        fill="none" stroke="#2c2c2c" stroke-width="1"/>

  <!-- Header decoration -->
  <line x1="50" y1="80" x2="550" y2="80" stroke="#8b4513" stroke-width="2"/>
  <text x="300" y="60" text-anchor="middle" class="mono"
        font-size="11" fill="#4a4a4a" letter-spacing="3">
    STOLPERSTEIN MEMORIAL
  </text>

  <!-- Star of David icon -->
  <g transform="translate(285, 90)">
    <polygon points="15,0 19,10 30,10 21,17 24,28 15,21 6,28 9,17 0,10 11,10"
             fill="none" stroke="#8b4513" stroke-width="1.5"/>
  </g>

  <!-- Business Type -->
  <text x="300" y="145" text-anchor="middle" class="mono"
        font-size="13" fill="#8b4513" letter-spacing="2">
    TEXTILES
  </text>

  <!-- Business Name -->
  <text x="300" y="200" text-anchor="middle" class="title"
        font-size="32" fill="#1a1a1a">
    Ebro Textiles
  </text>
  

  <!-- Decorative line -->
  <line x1="150" y1="260" x2="450" y2="260" stroke="#4a4a4a" stroke-width="1"/>

  <!-- Location -->
  <g transform="translate(300, 300)">
    <text x="0" y="0" text-anchor="middle" class="mono" font-size="11" fill="#4a4a4a" letter-spacing="2">
      LOCATION
    </text>
    <text x="0" y="25" text-anchor="middle" class="serif" font-size="18" fill="#1a1a1a">
      Alexanderstraße 125, Berlin
    </text>
  </g>

  <!-- Dates -->
  <g transform="translate(300, 380)">
    <text x="0" y="0" text-anchor="middle" class="mono" font-size="11" fill="#4a4a4a" letter-spacing="2">
      OPERATED
    </text>
    <text x="0" y="25" text-anchor="middle" class="serif" font-size="22" fill="#1a1a1a">
      09.1922 – 01.1939
    </text>
  </g>

  <!-- Horizontal rule -->
  <line x1="100" y1="440" x2="500" y2="440" stroke="#2c2c2c" stroke-width="1"/>

  <!-- Memorial text -->
  <text x="300" y="480" text-anchor="middle" class="serif"
        font-size="12" fill="#4a4a4a" font-style="italic">
    Jewish-owned business, Berlin
  </text>
  <text x="300" y="500" text-anchor="middle" class="serif"
        font-size="12" fill="#4a4a4a" font-style="italic">
    Forced to close during the Nazi regime
  </text>

  <!-- QR Code Section -->
  <g transform="translate(240, 530)">
    <rect x="-10" y="-10" width="140" height="140" fill="#ffffff" stroke="#2c2c2c" stroke-width="1"/>
    <g transform="scale(1)">
      <path fill="#ffffff" d="M0 0h31v31H0z"/><path stroke="#1a1a1a" d="M1 1.5h7m5 0h3m2 0h1m1 0h2m1 0h7M1 2.5h1m5 0h1m2 0h1m1 0h1m1 0h4m1 0h1m3 0h1m5 0h1M1 3.5h1m1 0h3m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m2 0h1m2 0h1m1 0h3m1 0h1M1 4.5h1m1 0h3m1 0h1m1 0h1m1 0h1m2 0h2m2 0h1m2 0h1m1 0h1m1 0h3m1 0h1M1 5.5h1m1 0h3m1 0h1m1 0h2m3 0h1m5 0h2m1 0h1m1 0h3m1 0h1M1 6.5h1m5 0h1m1 0h1m1 0h1m1 0h1m2 0h2m3 0h1m1 0h1m5 0h1M1 7.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M9 8.5h2m1 0h1m2 0h3m1 0h3M1 9.5h1m1 0h5m6 0h2m2 0h1m1 0h1m2 0h5M4 10.5h1m1 0h1m1 0h1m3 0h1m4 0h5m1 0h3m3 0h1M1 11.5h1m4 0h4m1 0h1m1 0h1m1 0h3m1 0h1m2 0h2M1 12.5h1m4 0h1m2 0h1m2 0h1m4 0h1m3 0h1m3 0h2m1 0h1M1 13.5h1m2 0h4m2 0h1m1 0h1m1 0h1m3 0h1m2 0h1m2 0h1m1 0h2M2 14.5h1m1 0h1m1 0h1m4 0h1m1 0h3m1 0h9m3 0h1M1 15.5h1m5 0h1m1 0h4m2 0h3m3 0h1m1 0h2m1 0h2M1 16.5h6m2 0h2m2 0h1m1 0h1m4 0h1m3 0h1m3 0h1M1 17.5h3m3 0h1m1 0h1m3 0h2m1 0h1m1 0h1m2 0h1m4 0h2M1 18.5h5m2 0h3m1 0h2m1 0h1m1 0h1m1 0h7m1 0h1m1 0h1M1 19.5h1m1 0h2m2 0h1m1 0h2m1 0h2m1 0h2m5 0h1m2 0h1m1 0h1M1 20.5h1m2 0h1m3 0h1m1 0h4m3 0h1m2 0h2m2 0h2m2 0h1M1 21.5h1m3 0h1m1 0h1m1 0h1m1 0h3m4 0h1m1 0h6m1 0h3M9 22.5h1m2 0h3m3 0h2m1 0h1m3 0h5M1 23.5h7m2 0h2m1 0h5m2 0h2m1 0h1m1 0h3M1 24.5h1m5 0h1m1 0h1m2 0h3m6 0h1m3 0h1M1 25.5h1m1 0h3m1 0h1m1 0h5m1 0h4m2 0h5m1 0h3M1 26.5h1m1 0h3m1 0h1m1 0h2m1 0h2m3 0h1m1 0h3m2 0h1m1 0h4M1 27.5h1m1 0h3m1 0h1m1 0h5m1 0h2m2 0h1m3 0h6M1 28.5h1m5 0h1m2 0h1m1 0h3m1 0h1m3 0h3m1 0h1m1 0h1m1 0h1M1 29.5h7m1 0h1m1 0h2m3 0h3m1 0h1m1 0h1m2 0h3"/>
    </g>
  </g>

  <!-- QR Code label -->
  <text x="300" y="700" text-anchor="middle" class="mono"
        font-size="10" fill="#4a4a4a" letter-spacing="1">
    SCAN FOR FULL STORY
  </text>

  <!-- Footer -->
  <line x1="50" y1="730" x2="550" y2="730" stroke="#8b4513" stroke-width="2"/>
  <text x="300" y="755" text-anchor="middle" class="mono"
        font-size="10" fill="#4a4a4a" letter-spacing="2">
    STORYTIMEMAPS.COM
  </text>
  <text x="300" y="775" text-anchor="middle" class="mono"
        font-size="9" fill="#4a4a4a">
    Research: Dr. Christoph Kreutzmüller
  </text>
</svg>