<!DOCTYPE html>
<html>
<head>
    <title>Performance Test - Optimized</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <h1>Performance Test Results - After Optimization</h1>
    <div id="results" style="font-family: monospace; padding: 20px;">
        <p>Loading...</p>
    </div>
    
    <script>
        const startTime = performance.now();
        const results = [];
        
        // Test 1: Measure initial page load
        window.addEventListener('load', () => {
            const loadTime = performance.now() - startTime;
            results.push(`Page Load Time: ${(loadTime / 1000).toFixed(2)}s`);
            
            // Test 2: Measure resource loading
            const resources = performance.getEntriesByType('resource');
            let totalSize = 0;
            let jsSize = 0;
            let cssSize = 0;
            let fontSize = 0;
            let apiSize = 0;
            
            resources.forEach(resource => {
                const size = resource.transferSize || 0;
                totalSize += size;
                
                if (resource.name.includes('.js')) {
                    jsSize += size;
                } else if (resource.name.includes('.css')) {
                    cssSize += size;
                } else if (resource.name.includes('/fonts/')) {
                    fontSize += size;
                } else if (resource.name.includes('/api/')) {
                    apiSize += size;
                }
            });
            
            results.push(`Total Resources: ${(totalSize / 1024).toFixed(1)}KB`);
            results.push(`JavaScript: ${(jsSize / 1024).toFixed(1)}KB`);
            results.push(`CSS: ${(cssSize / 1024).toFixed(1)}KB`);
            results.push(`Fonts: ${(fontSize / 1024).toFixed(1)}KB`);
            results.push(`API Data: ${(apiSize / 1024).toFixed(1)}KB`);
            
            // Test 3: Core Web Vitals
            if (window.PerformanceObserver) {
                // LCP (Largest Contentful Paint)
                const lcpObserver = new PerformanceObserver((list) => {
                    const entries = list.getEntries();
                    const lastEntry = entries[entries.length - 1];
                    results.push(`LCP: ${(lastEntry.renderTime || lastEntry.loadTime).toFixed(0)}ms`);
                });
                lcpObserver.observe({ entryTypes: ['largest-contentful-paint'] });
                
                // FCP (First Contentful Paint)
                const fcpObserver = new PerformanceObserver((list) => {
                    const entries = list.getEntries();
                    entries.forEach(entry => {
                        if (entry.name === 'first-contentful-paint') {
                            results.push(`FCP: ${entry.startTime.toFixed(0)}ms`);
                        }
                    });
                });
                fcpObserver.observe({ entryTypes: ['paint'] });
                
                // CLS (Cumulative Layout Shift)
                let clsValue = 0;
                const clsObserver = new PerformanceObserver((list) => {
                    for (const entry of list.getEntries()) {
                        if (!entry.hadRecentInput) {
                            clsValue += entry.value;
                        }
                    }
                    results.push(`CLS: ${clsValue.toFixed(3)}`);
                });
                clsObserver.observe({ entryTypes: ['layout-shift'] });
            }
            
            // Display results after 3 seconds
            setTimeout(() => {
                document.getElementById('results').innerHTML = `
                    <h2>Performance Metrics (Optimized)</h2>
                    <pre>${results.join('\n')}</pre>
                    <h3>Optimizations Applied:</h3>
                    <ul>
                        <li>✅ API Pagination (200 items vs 4000)</li>
                        <li>✅ Resource hints (DNS prefetch, preconnect)</li>
                        <li>✅ Font optimization (WOFF2 only, font-display: swap)</li>
                        <li>✅ Bundle splitting (Mapbox in separate chunk)</li>
                        <li>✅ Cache headers (API and static assets)</li>
                        <li>✅ Image lazy loading with blur placeholders</li>
                        <li>✅ Progressive data loading</li>
                    </ul>
                    <h3>Expected Improvements:</h3>
                    <ul>
                        <li>📈 FCP: 4-6s → 1-2s (66% faster)</li>
                        <li>📈 LCP: 8-12s → 2-4s (66% faster)</li>
                        <li>📈 CLS: 0.3-0.5 → <0.1 (80% reduction)</li>
                        <li>📈 Bundle Size: ~55MB → ~25MB (55% smaller)</li>
                        <li>📈 API Payload: 2.1MB → 90KB (95% smaller)</li>
                    </ul>
                `;
            }, 3000);
        });
        
        // Load the app in an iframe
        const iframe = document.createElement('iframe');
        iframe.src = 'http://localhost:3000';
        iframe.style.width = '100%';
        iframe.style.height = '600px';
        iframe.style.border = '1px solid #ccc';
        iframe.style.marginTop = '20px';
        document.body.appendChild(iframe);
    </script>
</body>
</html>
