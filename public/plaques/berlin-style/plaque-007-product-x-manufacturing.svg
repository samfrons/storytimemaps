<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <style>
      .title { font-family: Georgia, 'Times New Roman', serif; font-weight: normal; }
      .text { font-family: Georgia, 'Times New Roman', serif; }
      .url { font-family: 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Outer metallic frame -->
  <rect width="800" height="500" fill="#a0917a"/>

  <!-- Inner frame border -->
  <rect x="8" y="8" width="784" height="484"
        fill="#c4b8a8"/>

  <!-- Main white background -->
  <rect x="16" y="16" width="768" height="468"
        fill="#f8f6f0"/>

  <!-- Business Type (top, smaller) -->
  <text x="340" y="70" class="text"
        font-size="16" fill="#2c5282" font-style="italic">
    Manufacturing
  </text>

  <!-- Business Name (large, centered) -->
  <text x="340" y="130" class="title"
        font-size="36" fill="#1a365d" font-weight="600" letter-spacing="1">
    Product X Manufacturing
  </text>

  <!-- Dates -->
  <text x="340" y="180" class="text"
        font-size="22" fill="#1a365d">
    1926 – 1936
  </text>

  <!-- Address -->
  <text x="340" y="240" class="text"
        font-size="18" fill="#2c5282">
    Warschauer Straße 45, Berlin
  </text>

  <!-- Divider line -->
  <line x1="60" y1="280" x2="620" y2="280"
        stroke="#2c5282" stroke-width="0.5" opacity="0.5"/>

  <!-- URL at bottom -->
  <text x="340" y="450" class="url"
        font-size="14" fill="#2c5282" letter-spacing="1">
    storytimemaps.com
  </text>

