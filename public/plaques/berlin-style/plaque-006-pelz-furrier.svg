<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <style>
      .title { font-family: Georgia, 'Times New Roman', serif; font-weight: normal; }
      .text { font-family: Georgia, 'Times New Roman', serif; }
      .url { font-family: 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Outer metallic frame -->
  <rect width="800" height="450" fill="#a0917a"/>

  <!-- Inner frame border -->
  <rect x="8" y="8" width="784" height="434"
        fill="#c4b8a8"/>

  <!-- Main white background -->
  <rect x="16" y="16" width="768" height="418"
        fill="#f8f6f0"/>

  <!-- Business Type (top, smaller) -->
  <text x="335" y="65" text-anchor="middle" class="text"
        font-size="16" fill="#2c5282" font-style="italic">
    Furrier
  </text>

  <!-- Business Name (large, centered) -->
  <text x="335" y="115" text-anchor="middle" class="title"
        font-size="36" fill="#1a365d" font-weight="600">
    Pelz Furrier
  </text>

  <!-- Dates -->
  <text x="335" y="165" text-anchor="middle" class="text"
        font-size="22" fill="#1a365d">
    1918 – 1937
  </text>

  <!-- Address -->
  <text x="335" y="215" text-anchor="middle" class="text"
        font-size="18" fill="#2c5282">
    Friedrichstraße 180, Berlin
  </text>

  <!-- Divider line -->
  <line x1="80" y1="250" x2="540" y2="250"
        stroke="#2c5282" stroke-width="0.5" opacity="0.4"/>

  <!-- URL at bottom -->
  <text x="335" y="400" text-anchor="middle" class="url"
        font-size="13" fill="#2c5282" letter-spacing="1">
    storytimemaps.com
  </text>

